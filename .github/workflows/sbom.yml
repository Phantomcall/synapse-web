# SBOM for every production build (#154).
#
# Builds the app exactly as CI does, prunes dev dependencies so node_modules
# holds only the production tree, then:
#   1. generates a CycloneDX 1.6 JSON SBOM with @cyclonedx/cyclonedx-npm,
#   2. validates it against the CycloneDX 1.6 schema with the CycloneDX CLI,
#   3. cross-checks it against package-lock.json (scripts/ci/verify-sbom.mjs),
#   4. uploads it as a build artifact, and attaches it to the GitHub release
#      when the run was triggered by publishing one.
#
# Details: docs/ci/sbom.md

name: SBOM

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/ci/verify-sbom.mjs
      - .github/workflows/sbom.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CYCLONEDX_NPM_VERSION: 6.0.1
  CYCLONEDX_CLI_VERSION: v0.33.1
  CYCLONEDX_CLI_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM to a release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The SBOM describes what ships, so dev tooling (and anything npm installed
      # only because of it) must be gone before the tree is read.
      - name: Prune to the production dependency tree
        run: npm prune --omit=dev

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" \
            --omit dev \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --mc-type application \
            --output-file "sbom/synapse-web-${GITHUB_SHA}.cdx.json"

      - name: Validate against the CycloneDX 1.6 schema
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64"
          echo "${CYCLONEDX_CLI_SHA256}  $RUNNER_TEMP/cyclonedx" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cyclonedx"
          "$RUNNER_TEMP/cyclonedx" validate \
            --input-file "sbom/synapse-web-${GITHUB_SHA}.cdx.json" \
            --input-format json --input-version v1_6 --fail-on-errors

      - name: Cross-check against package-lock.json
        run: node scripts/ci/verify-sbom.mjs "sbom/synapse-web-${GITHUB_SHA}.cdx.json" package-lock.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp "sbom/synapse-web-${GITHUB_SHA}.cdx.json" "sbom/synapse-web-${TAG}.cdx.json"
          gh release upload "$TAG" "sbom/synapse-web-${TAG}.cdx.json" --clobber
