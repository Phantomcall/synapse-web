name: Bundle Size Budget CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bundle-budget:
    name: Production Bundle Size Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run bundle budget test suite
        run: npx vitest run scripts/check-bundle-size.test.ts
