name: Accessibility CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  a11y-gate:
    name: WCAG 2.1 AA Accessibility Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run automated Accessibility CI Gate
        run: npx vitest run lib/__tests__/a11y-gate.test.tsx
